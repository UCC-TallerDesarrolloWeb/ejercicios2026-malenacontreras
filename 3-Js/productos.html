<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Catalogo de productos</title>
        <link href="catalogo.css" type="text/css" rel="stylesheet">
        <script type="text/javascript" src="tienda.js"></script>
    </head>
    <body onload="cargarProductos(); contarProductos()">
        <div class="grid-container">
            <header class="item1">
                Catalogo productos
            </header>
            
            <nav class="item2">
                <a href="productos.html">Catalogo de productos</a>
                <a href="carrito.html">Carrito de compras</a>
                <div id="cp-prod">0</div>
            </nav>
            
            <aside class="item3">
                <form name="filter">
                    <fieldset>
                        <legend>Busqueda</legend>
                        <label for="search">Buscar</label>
                        <input type="text" id="search" name="search" onchange="filtrarProductos()">
                    </fieldset>
                    <fieldset>
                        <legend>Precios</legend>
                        <p>
                            <label for="Minimo">Minimo</label>
                            <input type="number" id="minimo" name="precio-min" min="0" onchange="filtrarProductos()">
                        </p>
                        <p>
                            <label for="price-max">Maximo</label>
                            <input type="number" id="maximo" name="Maximo" onchange="filtrarProductos()">
                        </p>
                    </fieldset>
                    <fieldset>
                        <legend>Marca</legend>
                        <select id="marca" onchange="filtrarProductos()">
                            <option value="">Todas</option>
                            <option value="Gran Marc">Gran Marc</option>
                            <option value="Daedo">Daedo</option>
                        </select>
                    </fieldset>
                    <fieldset>
                        <legend>Tipo de productos</legend>
                        <p>
                            <input type="checkbox" id=" protectores " name="tipo " value=" protectortes" onchange="filtrarProductos()">
                            <label for="protectores">Protectores</label>

                            <input type="checkbox" id=" entrenamiento " name="tipo " value=" entrenamiento" onchange="filtrarProductos()">
                            <label for="entrenamiento">entrenamiento</label>

                            <input type="checkbox" id="dobok" name="tipo " value="dobok" onchange="filtrarProductos()">
                            <label for="dobok">dobok</label>
                        </p>
                    </fieldset>
                    <fieldset>
                        <legend>Orden</legend>
                        <select id="order" onchange="ordenarCatalogo()">
                            <option value="menor">Menor a mayor</option>
                            <option value="mayor">Mayor a menor</option>
                            <option value="a-z">A - Z</option>
                            <option value="z-a">Z - A</option>
                        </select>
                    </fieldset>
                </form>
            </aside>
            
            <main class="item4" id="mostrar-catalogo">
            </main>

            <dialog id="dialogo">
                <h2>Detalle del Producto</h2>
                <h3 id="titulo-producto"></h3>
                <p id="descripcion-producto"></p>
                <button onclick="cerrarDialogo()">Cerrar</button>
            </dialog>
            
            <footer class="item5">
                Contacto
            </footer>
        </div>
    </body>
</html>
